# Common beams, one per diagram in the documentation gallery.
_environment: structural

simple_udl:
  spans: [6 m]
  node_labels: auto
  loads:
    - dist: {w: 4.5 kN/m, case: D}
    - dist: {w: 6 kN/m, case: L}

propped_cantilever:
  spans: [5 m]
  supports: [fixed, roller]
  node_labels: auto
  loads:
    - point: {p: 25 kN, x: 2 m, case: L}
    - dist: {w: 3 kN/m, case: D}

overhang:
  spans: [5 m, 1.5 m]
  cantilever: right
  loads:
    - dist: {w: 2 kN/m, case: D}
    - point: {p: 12 kN, loc: L, case: L}
    - point: {p: 8 kN, x: 2.5 m, case: S}
    - moment: {m: 6 kN*m, loc: L, case: D}

floor_beam:
  spans: [4.2 m, 4.8 m, 3.6 m]
  depth: 400 mm
  node_labels: auto
  loads:
    - pressure: {q: office, trib: 3 m}
    - pressure: {q: 1.2 kPa, trib_width1: 3 m, trib_width2: 1 m, span_loc1: [2, 0 m], case: SDL}
    - point: {p: 18 kN, span_loc: [1, 2.4 m], case: L}
  occupancies:
    office: {D: 2.0 kPa, L: 2.4 kPa}

# A core footing on soil that only pushes: three columns, and a lift core whose
# walls push down 5000 kN and pull up 3000 kN under lateral load. The heel
# under the tension flange lifts off the soil.
core_footing:
  spans: [14000 mm]
  e: 25 GPa
  i: 360e9 mm**4                      # 2500 wide x 1200 deep
  depth: 1200 mm
  foundation:
    ks: [null, 20 MPa/m]              # compression only: soil can't hold the footing down
    width: 2500 mm
  loads:
    - point: {p: 1500 kN, loc: 800 mm}        # column C1
    - point: {p: 1800 kN, loc: 3800 mm}       # column C2
    - point: {p: 1500 kN, loc: 6800 mm}       # column C3
    - point: {p: 5000 kN, loc: 9500 mm}       # core wall, compression flange
    - point: {p: -3000 kN, loc: 12500 mm}     # core wall, tension flange (60%)
  results: [pressure, deflection, moment, shear]
