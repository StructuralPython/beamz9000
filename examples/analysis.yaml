# Beams with analysis results: listing anything under `results` analyses the
# beam (with pycba-tools or pynite-tools) and draws the diagrams asked for, and
# each support's reactions if `reactions` is listed. Without load combinations,
# every load case is drawn; with them, shear, moment and reactions are factored
# envelopes (see factored_floor_beam).
_environment: structural

floor_beam:
  spans: [4.2 m, 4.8 m, 3.6 m]
  e: 200 GPa
  i: 120e6 mm**4
  node_labels: auto
  loads:
    - pressure: {q: office, trib: 3 m}
    - point: {p: 18 kN, span_loc: [1, 2.4 m], case: L}
  occupancies:
    office: {D: 2.0 kPa, L: 2.4 kPa}
  results: [forces, deflections, reactions]

cantilever:
  spans: [3000 mm]
  cantilever: right                 # fixed at the left end
  node_labels: [A, B]
  loads:
    - dist: {w: 4 kN/m, case: D}
    - point: {p: 10 kN, loc: L, angle: 30, case: L}
  results: [moment, shear, reactions]

on_springs:
  spans: [3000 mm, 5000 mm, 2000 mm]
  ei: 60000 kN*m**2
  node_labels: auto
  supports:
    - rotational_spring: 8000 kN*m
    - roller
    - spring: 12 kN/mm
    - free
  loads:
    - dist: {w: 3 kN/m, case: D}
    - point: {p: 12 kN, span_loc: [1, 2000 mm], case: L}
    - point: {p: 6 kN, loc: L, case: L}
  results:
    diagrams: [forces, rotations, reactions]
    engine: pynite

factored_floor_beam:
  spans: [4.2 m, 4.8 m, 3.6 m]
  e: 200 GPa
  i: 120e6 mm**4
  node_labels: auto
  loads:
    - pressure: {q: office, trib: 3 m}
    - point: {p: 18 kN, span_loc: [1, 2.4 m], case: L}
  occupancies:
    office: {D: 2.0 kPa, L: 2.4 kPa}
  load_combos:
    forces:                         # envelope reactions, shear and moment
      - ULS1: {D: 1.4}
      - ULS2: {D: 1.25, L: 1.5}
      - ULS3: {D: 0.9, L: 1.5}
    deflections:                    # envelope deflection and rotation
      - SLS: {D: 1.0, L: 1.0}
  results: [forces, deflections, reactions]

# A strip footing on soil that only pushes: `foundation` puts the whole beam on
# an elastic (Winkler) foundation, its nodes are free, and `pressure` draws the
# soil pressure under it. Here the far end lifts off.
on_foundation:
  spans: [6000 mm]
  e: 25 GPa
  i: 9000e6 mm**4                   # 500 wide x 600 deep
  depth: 600 mm
  node_labels: auto
  foundation:
    ks: [null, 5 MPa/m]             # [tension, compression]; null: compression only
    width: 500 mm                   # the beam sees ks x width
  loads:
    - point: {p: 400 kN, loc: 1200 mm, case: D}
    - dist: {mag1: 10 kN/m, mag2: 30 kN/m, x1: 2000 mm, x2: 6000 mm, case: D}
  results: [pressure, deflection, moment, shear]
