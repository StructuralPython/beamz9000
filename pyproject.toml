[project]
name = "beamz9000"
version = "0.2.0"
description = "Beam free-body diagrams from a simple YAML scheme, drawn through shapely geometry."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Connor Ferster", email = "connor@structuralpython.com" }]
requires-python = ">=3.12"
dependencies = [
    "forallpeople>=3.4.0",
    "matplotlib>=3.11",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "shapely>=2.1",
]

[project.urls]
Home = "https://github.com/StructuralPython/beamz9000"
Documentation = "https://beamz9000.structuralpython.com"

[project.optional-dependencies]
reportlab = [
    "reportlab>=4.2",
]
ymprint = [
    "ymprint>=0.12.0 ; python_full_version >= '3.14'",
]
pycba = [
    "pycba-tools>=0.1.0",
]
pynite = [
    "pynite-tools>=0.8.1",
]

# The _beam block for ymprint's `ym` command and every other ymprint application
# (ymprint 0.12 and later read the `ymprint.blocks` entry-point group).
[project.entry-points."ymprint.blocks"]
_beam = "beamz9000.ymprint:beam_block"

[build-system]
requires = ["uv_build>=0.9.14,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pycba-tools>=0.1.0",
    "pynite-tools>=0.8.1",
    "pytest>=8.3",
    "reportlab>=4.2",
    "ymprint>=0.12.0 ; python_full_version >= '3.14'",
]
docs = [
    "autodoc-pydantic>=2.2.0",
    "pycba-tools>=0.1.0",
    "pynite-tools>=0.8.1",
    "myst-parser>=5.2.0",
    "shibuya>=2026.7.12",
    "sphinx>=9.1.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
